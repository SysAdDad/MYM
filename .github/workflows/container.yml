name: Test and publish release image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/sysaddad/mym-community" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
      - name: Set up emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build local test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: mym-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run regression tests inside the image
        run: docker run --rm --network none --volume "$PWD/tests:/tests:ro" mym-ci:test python -m unittest discover -s /tests -q
      - name: Validate Compose
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.arcane.yaml config --quiet
      - name: Test first-run setup and persistent volume
        run: |
          docker volume create mym-ci-data
          docker run -d --name mym-ci --publish 127.0.0.1:18080:8080 --env COOKIE_SECURE=false --volume mym-ci-data:/data mym-ci:test
          python3 scripts/container-smoke.py
      - name: Clean up disposable test container
        if: always()
        run: |
          docker rm -f mym-ci 2>/dev/null || true
          docker volume rm mym-ci-data 2>/dev/null || true
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested Community image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Make Your Mark Community by SysAdDad
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
